name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the PHP packages' lookup
        # renovate.json looks up Alpine's PHP package in one Alpine branch's index: the Dockerfile's.
        # (The image build below fails if the mirror doesn't have the Dockerfile's minimum version.)
        run: |
          dockerfile=etc/docker/php/Dockerfile
          alpine=$(sed -n 's/^FROM docker\.io\/\(library\/\)\{0,1\}alpine:\([0-9]*\.[0-9]*\)\.[0-9]*\( AS [a-z]*\)\{0,1\}$/\2/p' "$dockerfile")
          php=$(sed -n 's/^ARG PHP_VERSION="\{0,1\}\([0-9]*\)"\{0,1\}$/\1/p' "$dockerfile")
          minimum=$(sed -n 's/^ARG PHP_PACKAGE_VERSION="\([^"]*\)"$/\1/p' "$dockerfile")
          lookup="$(sed -n 's/^ *"registryUrlTemplate": "https:\/\/dl-cdn\.alpinelinux\.org\/alpine?branch=\(v[0-9.]*\)\&.*",\{0,1\}$/\1/p' renovate.json) $(sed -n 's/^ *"depNameTemplate": "\(php[0-9]*\)",$/\1/p' renovate.json)"
          echo "renovate.json looks up ${lookup}; the Dockerfile installs v${alpine} php${php}>=${minimum}"
          test -n "$alpine" && test -n "$php" && test -n "$minimum" && test "$lookup" = "v${alpine} php${php}" ||
            { echo "renovate.json's PHP package lookup differs from the Dockerfile (or one was not found): move them together." >&2; exit 1; }
      - name: Check composer.json's PHP against the Dockerfile's
        # Renovate's own Composer (lock updates) runs on the newest PHP that app/composer.json's require.php allows.
        run: |
          php=$(sed -n 's/^ARG PHP_VERSION="\{0,1\}\([0-9]\)\([0-9]*\)"\{0,1\}$/~\1.\2.0/p' etc/docker/php/Dockerfile)
          required=$(jq -r '.require.php // ""' app/composer.json)
          echo "app/composer.json requires PHP ${required}; the Dockerfile installs ${php}"
          test -n "$php" && test "$required" = "$php" ||
            { echo "Move app/composer.json's require.php (and its lock) with the Dockerfile's PHP_VERSION." >&2; exit 1; }
      - name: Install locked dependencies
        run: |
          mkdir -p var/composer-cache
          ./bin/composer validate --strict
          ./bin/composer install --no-interaction --prefer-dist
      - name: Build PHP runtime and check the application
        run: |
          docker build -t nagadmin-php-check etc/docker/php
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/code" -w /code/app nagadmin-php-check sh -ec '
              php -r '\''require "vendor/autoload.php";'\''
              vendor/bin/phpstan analyse -c phpstan.neon --no-progress
              vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php
              vendor/bin/twig-cs-fixer lint --config=.twig-cs-fixer.dist.php
            '

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify container build
        run: docker build -f ../../etc/docker/node/Dockerfile .
